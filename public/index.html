<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffe8a3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Toddler Flashcards</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Flashcards</h1>
      <button type="button" class="icon-btn" id="settingsBtn" aria-label="Parent settings">⚙️</button>
    </header>

    <p class="hint" id="hint">Tap a picture to hear the word</p>
    <p class="status" id="status" hidden></p>

    <main class="grid" id="grid" role="list"></main>

    <nav class="pager" aria-label="Flashcard pages">
      <button type="button" class="pager-btn" id="prevBtn" aria-label="Previous page">◀ Prev</button>
      <div class="pager-center">
        <p class="page-indicator" id="pageIndicator" aria-live="polite">1 / 10</p>
        <div class="page-dots" id="pageDots" role="navigation" aria-label="Jump to page"></div>
      </div>
      <button type="button" class="pager-btn" id="nextBtn" aria-label="Next page">Next ▶</button>
    </nav>
  </div>

  <dialog class="sheet" id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>Parent settings</h2>
      <p class="sheet-note">Optional: paste a Voice ID to use a cloned parent voice. Leave blank to use the server default from <code>.env</code>.</p>
      <label for="voiceIdInput">ElevenLabs Voice ID</label>
      <input
        id="voiceIdInput"
        name="voiceId"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="e.g. from ElevenLabs Voices"
        inputmode="text"
      />
      <div class="sheet-actions">
        <button type="submit" class="btn primary" value="save">Save</button>
        <button type="button" class="btn" id="clearVoiceBtn">Clear override</button>
        <button type="submit" class="btn ghost" value="cancel">Close</button>
      </div>
      <p class="sheet-foot" id="healthNote"></p>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
